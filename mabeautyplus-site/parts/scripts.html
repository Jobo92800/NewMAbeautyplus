<script>
/* ---- Menu mobile ---- */
(function(){
  var b=document.getElementById('burger'), m=document.getElementById('mnav');
  if(!b||!m) return;
  b.addEventListener('click',function(){
    var open=m.classList.toggle('open');
    b.classList.toggle('on',open);
    b.setAttribute('aria-expanded',open?'true':'false');
    document.body.style.overflow=open?'hidden':'';
  });
  m.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click',function(){
      m.classList.remove('open'); b.classList.remove('on');
      b.setAttribute('aria-expanded','false'); document.body.style.overflow='';
    });
  });
})();

/* ---- Smooth scroll ---- */
document.querySelectorAll('.js-scroll, .nav a[href^="#"], .mnav a[href^="#"]').forEach(function(a){
  a.addEventListener('click', function(e){
    var id = a.getAttribute('href');
    if(id && id.charAt(0)==='#'){
      var el = document.querySelector(id);
      if(el){ e.preventDefault(); el.scrollIntoView({behavior:'smooth', block:'start'}); }
    }
  });
});

/* ---- FAQ accordion ---- */
document.querySelectorAll('#faqList .faq-item').forEach(function(item){
  var q = item.querySelector('.faq-q');
  var a = item.querySelector('.faq-a');
  q.addEventListener('click', function(){
    var open = item.classList.contains('open');
    document.querySelectorAll('#faqList .faq-item.open').forEach(function(o){
      o.classList.remove('open'); o.querySelector('.faq-a').style.maxHeight = null;
    });
    if(!open){ item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
  });
});

/* ---- Carrousel "pain" ---- */
(function(){
  var track = document.getElementById('painTrack');
  var dots = document.getElementById('painDots');
  if(!track||!dots) return;
  var cards = track.querySelectorAll('.pcard');
  cards.forEach(function(_,i){
    var d=document.createElement('i'); if(i===0)d.className='on';
    d.addEventListener('click',function(){ cards[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); });
    dots.appendChild(d);
  });
  track.addEventListener('scroll',function(){
    var idx=Math.round(track.scrollLeft/(track.scrollWidth/cards.length));
    dots.querySelectorAll('i').forEach(function(d,i){ d.classList.toggle('on', i===Math.min(idx,cards.length-1)); });
  },{passive:true});
})();

/* ---- Carrousel témoignages (mobile) ---- */
(function(){
  var track = document.getElementById('testiGrid');
  var dots = document.getElementById('testiDots');
  if(!track||!dots) return;
  var cards = track.querySelectorAll('.tc');
  cards.forEach(function(_,i){
    var d=document.createElement('i'); if(i===0)d.className='on';
    d.addEventListener('click',function(){ cards[i].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); });
    dots.appendChild(d);
  });
  track.addEventListener('scroll',function(){
    var idx=Math.round(track.scrollLeft/(track.scrollWidth/cards.length));
    dots.querySelectorAll('i').forEach(function(d,i){ d.classList.toggle('on', i===Math.min(idx,cards.length-1)); });
  },{passive:true});
})();

document.querySelectorAll('.js-schedule').forEach(function(a){
  a.addEventListener('click', function(){
    if(window.fbq) fbq('track','Schedule');
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({event:'rdv_calendly'});
  });
});

/* ---- Formulaire → Netlify function → Airtable ---- */
document.querySelectorAll('[data-lead-form]').forEach(function(form){
  var msg = form.querySelector('[data-msg]');
  var card = form.closest('.form-card');
  var success = card ? card.querySelector('[data-success]') : null;

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.className = 'form-msg';
    var data = {
      prenom: form.prenom.value.trim(),
      nom: form.nom.value.trim(),
      telephone: form.telephone.value.trim(),
      email: form.email.value.trim(),
      centre: form.centre.value,
      soins: form.soins.value,
      source: 'Site'
    };
    if(!data.prenom||!data.nom||!data.telephone||!data.email||!data.centre||!data.soins||!form.consent.checked){
      msg.textContent = 'Merci de remplir tous les champs et de cocher la case de consentement.';
      msg.classList.add('show','err'); return;
    }
    var btn = form.querySelector('button[type=submit]');
    var label = btn.textContent; btn.disabled = true; btn.textContent = 'Envoi en cours…';

    fetch('/.netlify/functions/lead', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)
    })
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, body:j}; }); })
    .then(function(res){
      if(res.ok){
        if(window.fbq) fbq('track','Lead');
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({event:'lead_form', form_source:'Site', objectif:data.soins, centre:data.centre});
        form.style.display='none';
        if(success){ success.classList.add('show'); success.scrollIntoView({behavior:'smooth',block:'center'}); }
      } else {
        msg.textContent = (res.body && res.body.error) || "Une erreur est survenue. Réessayez ou appelez-nous au 04 66 73 02 00.";
        msg.classList.add('show','err');
        btn.disabled=false; btn.textContent=label;
      }
    })
    .catch(function(){
      msg.textContent = "Une erreur est survenue. Réessayez ou appelez-nous au 04 66 73 02 00.";
      msg.classList.add('show','err');
      btn.disabled=false; btn.textContent=label;
    });
  });
});
</script>
</body>
</html>
